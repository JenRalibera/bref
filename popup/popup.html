<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bref — Notes du site</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="popup-header">
      <h1 class="popup-title">Bref</h1>
      <p class="popup-subtitle">Notes associées aux sites web, par URL.</p>
    </header>

    <main class="popup-main">
      <section class="empty-state" aria-labelledby="empty-state-title">
        <h2 class="empty-state-title" id="empty-state-title">Aucune note pour ce site</h2>
        <p class="empty-state-hint">
          Les notes que vous créerez pour le site ouvert apparaîtront ici.
        </p>
      </section>
    </main>
  </body>
</html>
